name: Cloud identity verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository_id == '1422735194' && github.ref == 'refs/heads/main'
    environment: development
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify project and enabled services without deploying
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          test "$PROJECT_ID" = "ai-city-511822"
          gcloud projects describe "$PROJECT_ID" --format='value(projectId)'
          gcloud services list --enabled --project="$PROJECT_ID" --format='value(config.name)'
